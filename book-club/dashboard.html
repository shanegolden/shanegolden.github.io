<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Club Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:20px; }
    h1 { color:#333; }
    .section { background:white; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:20px; }
    .book-card { display:flex; align-items:center; margin:10px 0; }
    .book-card img { width:100px; height:150px; object-fit:cover; margin-right:15px; border-radius:4px; }
    button { margin:5px; padding:8px 12px; cursor:pointer; }
    .inline { display:flex; align-items:center; gap:10px; margin-top:10px; }
    select { padding:5px; }
  </style>
</head>
<body>
  <h1>📚 My Dashboard!</h1>

  <div id="submissionSection" class="section">
    <h2>Submit a Book</h2>
    <div id="submissionForm">
      <input id="bookTitle" placeholder="Book Title" />
      <input id="bookAuthor" placeholder="Author" />
      <button id="submitBookBtn">Submit</button>
    </div>
    <div id="matchingOptions" style="margin-top:10px;"></div>
  </div>

  <div class="section">
    <h2>My Submissions</h2>
    <div id="mySubmissions"></div>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, query, where, getDocs, addDoc, doc, updateDoc, onSnapshot, orderBy 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser, activePeriodId;

// User auth
onAuthStateChanged(auth, async (user)=>{
  if(!user) window.location.href="login.html";
  else {
    currentUser=user;
    loadActiveSubmissionPeriod();
    loadMySubmissions();
  }
});

// Load active submission period
function loadActiveSubmissionPeriod(){
  const q = query(collection(db,"submissionsPeriods"), where("active","==",true));
  onSnapshot(q, snap=>{
    if(snap.empty){
      document.getElementById("submissionSection").style.display="none";
      activePeriodId=null;
    } else {
      activePeriodId = snap.docs[0].id;
      document.getElementById("submissionSection").style.display="block";
      checkAlreadySubmitted();
    }
  });
}

// Check if user already submitted
async function checkAlreadySubmitted(){
  const q = query(collection(db,"books"), where("submittedBy","==",currentUser.uid), where("submissionPeriodId","==",activePeriodId));
  const snap = await getDocs(q);
  if(!snap.empty){
    document.getElementById("submissionForm").style.display="none";
  } else {
    document.getElementById("submissionForm").style.display="flex";
  }
}

// Submit Book
document.getElementById("submitBookBtn").addEventListener("click", async ()=>{
  const titleInput = document.getElementById("bookTitle").value.trim();
  const authorInput = document.getElementById("bookAuthor").value.trim();
  if(!titleInput || !authorInput) return alert("Title and author required.");

  // Fetch matches from Open Library
  const search = `${titleInput} ${authorInput}`;
  const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(titleInput)}&author=${encodeURIComponent(authorInput)}&limit=5`);
  const data = await res.json();
  if(!data.docs || data.docs.length===0) return alert("No matches found.");

  const optionsDiv = document.getElementById("matchingOptions");
  optionsDiv.innerHTML = "<strong>Select the correct match:</strong><br>";
  data.docs.forEach(async (b)=>{
    const coverUrl = b.cover_i ? `https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg` : "";
    const div = document.createElement("div");
    div.className="book-card";
    div.innerHTML = `<img src="${coverUrl}" /><div>${b.title} by ${b.author_name?.[0]||""}<button>Select</button></div>`;
    optionsDiv.appendChild(div);

    div.querySelector("button").addEventListener("click", async ()=>{
      await addDoc(collection(db,"books"),{
        title: b.title,
        author: b.author_name?.[0]||"",
        coverUrl,
        submittedBy: currentUser.uid,
        submissionPeriodId: activePeriodId
      });
      optionsDiv.innerHTML="";
      document.getElementById("submissionForm").style.display="none";
    });
  });
});

// Load user's submissions
function loadMySubmissions(){
  const q = query(collection(db,"books"), where("submittedBy","==",currentUser.uid));
  onSnapshot(q, snap=>{
    const container = document.getElementById("mySubmissions");
    container.innerHTML="";
    snap.docs.forEach(docSnap=>{
      const b = docSnap.data();
      const div = document.createElement("div");
      div.className="book-card";
      div.innerHTML = `<img src="${b.coverUrl||''}" /><div>${b.title}<br>${b.author}</div>`;
      container.appendChild(div);
    });
  });
}
  </script>
</body>
</html>
