<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Club Dashboard</title>
</head>
<body>
  <h1>📚 Book Club Dashboard</h1>
  <button id="logoutBtn">Log Out</button>
  <hr>

  <p id="submissionStatus"></p>

  <div id="bookSubmissionArea">
    <h2>Submit Your Book</h2>
    <input id="bookTitle" placeholder="Book Title" />
    <input id="bookAuthor" placeholder="Author Name" />
    <input id="bookISBN" placeholder="ISBN (optional)" />
    <button id="submitBookBtn">Submit Book</button>
    <p id="submissionMessage"></p>
  </div>
  <hr>

  <div id="myBooksArea">
    <h2>My Submissions</h2>
    <div id="myBooksList"></div>
  </div>

  <hr>
  <div id="historyArea">
    <h2>Submission History</h2>
    <div id="historyList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, getDocs, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    let currentUser = null;
    let currentPeriodId = null;

    const submissionStatusP = document.getElementById("submissionStatus");
    const submitBookBtn = document.getElementById("submitBookBtn");
    const submissionMessage = document.getElementById("submissionMessage");
    const myBooksList = document.getElementById("myBooksList");
    const historyList = document.getElementById("historyList");

    // Fetch book info and return top 3 matches
    async function fetchBookInfo(title, author, isbn) {
      try {
        if (isbn) {
          const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
          const data = await res.json();
          const key = `ISBN:${isbn}`;
          if (data[key]) {
            return [{
              title: data[key].title || title,
              author: data[key].authors?.[0]?.name || author,
              coverUrl: data[key].cover?.medium || "",
              description: data[key].notes || ""
            }];
          }
        }

        const searchRes = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=5`);
        const searchData = await searchRes.json();
        if (!searchData.docs || searchData.docs.length === 0) return [{ title, author, coverUrl: "", description: "" }];
        return searchData.docs.slice(0,3).map(doc => ({
          title: doc.title || title,
          author: doc.author_name?.[0] || author,
          coverUrl: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : "",
          description: doc.first_sentence?.[0] || ""
        }));
      } catch (err) {
        console.error("Error fetching book info:", err);
        return [{ title, author, coverUrl: "", description: "" }];
      }
    }

    // Real-time check of submission period
    const submissionPeriodsCol = collection(db, "submissionPeriods");
    onSnapshot(submissionPeriodsCol, snap => {
      const openPeriod = snap.docs.find(d => d.data().open);
      currentPeriodId = openPeriod ? openPeriod.id : null;
      submissionStatusP.innerText = openPeriod ? "Book submissions are OPEN" : "Book submissions are CLOSED";
      submitBookBtn.disabled = !openPeriod;
      loadMyBooks();
    });

    // Load user's submissions for current period
    async function loadMyBooks() {
      myBooksList.innerHTML = "";
      historyList.innerHTML = "";

      if (!currentUser) return;

      const booksSnap = await getDocs(collection(db, "books"));
      const userBooks = booksSnap.docs.filter(d => d.data().submittedBy === currentUser.uid);
      const currentBooks = userBooks.filter(b => b.data().submissionPeriodID === currentPeriodId);
      const pastBooks = userBooks.filter(b => b.data().submissionPeriodID !== currentPeriodId);

      // Current submission
      currentBooks.forEach(d => {
        const data = d.data();
        const div = document.createElement("div");
        div.innerHTML = `
          <img src="${data.coverUrl}" alt="cover" width="80"/>
          <b>${data.title}</b> by ${data.author}<br/>
          <i>${data.description || ""}</i><br/>
          <button class="editBtn">Edit Match</button>
        `;
        myBooksList.appendChild(div);

        div.querySelector(".editBtn").addEventListener("click", async () => {
          const alternatives = await fetchBookInfo(data.title, data.author, "");
          const altTitles = alternatives.map((m,i)=>`${i+1}: ${m.title} by ${m.author}`).join("\n");
          const choice = prompt(`Select correct match:\n${altTitles}\nEnter 1, 2, or 3:`);
          const selected = alternatives[parseInt(choice)-1];
          if (!selected) return;
          await updateDoc(doc(db, "books", d.id), {
            title: selected.title,
            author: selected.author,
            coverUrl: selected.coverUrl,
            description: selected.description
          });
          loadMyBooks();
        });
      });

      // History
      pastBooks.forEach(d => {
        const data = d.data();
        const div = document.createElement("div");
        div.innerHTML = `
          <img src="${data.coverUrl}" alt="cover" width="80"/>
          <b>${data.title}</b> by ${data.author}<br/>
          <i>${data.description || ""}</i>
        `;
        historyList.appendChild(div);
      });
    }

    // Submit book
    submitBookBtn.addEventListener("click", async () => {
      const title = document.getElementById("bookTitle").value.trim();
      const author = document.getElementById("bookAuthor").value.trim();
      const isbn = document.getElementById("bookISBN").value.trim();

      if (!title || !author) {
        submissionMessage.innerText = "Title and author required.";
        return;
      }

      // Check if user already submitted in this period
      const booksSnap = await getDocs(collection(db, "books"));
      const alreadySubmitted = booksSnap.docs.some(d =>
        d.data().submittedBy === currentUser.uid && d.data().submissionPeriodID === currentPeriodId
      );
      if (alreadySubmitted) {
        submissionMessage.innerText = "You already submitted a book this period.";
        return;
      }

      const matches = await fetchBookInfo(title, author, isbn);
      const match = matches[0]; // default match

      await addDoc(collection(db, "books"), {
        title: match.title,
        author: match.author,
        coverUrl: match.coverUrl,
        description: match.description,
        submittedBy: currentUser.uid,
        submissionPeriodID: currentPeriodId,
        votes: 0,
        active: false,
        createdAt: serverTimestamp()
      });

      submissionMessage.innerText = `Book "${match.title}" submitted!`;
      document.getElementById("bookTitle").value = "";
      document.getElementById("bookAuthor").value = "";
      document.getElementById("bookISBN").value = "";
      loadMyBooks();
    });

    // Auth listener
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        loadMyBooks();
      }
    });
  </script>
</body>
</html>
