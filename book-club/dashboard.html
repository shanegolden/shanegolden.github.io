<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Club Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin:0; padding:0; }
  header { background:#4A90E2; color:white; padding:20px; text-align:center; }
  main { max-width: 900px; margin: 20px auto; background:white; padding:20px; border-radius:10px; }
  h1,h2 { margin-top:0; }
  #submissionForm input { padding:10px; margin:5px; width: calc(100% - 24px); box-sizing:border-box; }
  #submissionForm button { padding:10px 20px; margin:10px 0; background:#4A90E2; color:white; border:none; border-radius:5px; cursor:pointer; }
  #submissionForm button:disabled { background:grey; cursor:default; }
  .book-card { display:flex; align-items:center; margin:15px 0; background:#f9f9f9; padding:10px; border-radius:8px; }
  .book-card img { width:120px; height:auto; margin-right:20px; border-radius:5px; }
  .book-card .info { flex:1; }
  .book-card .actions button { margin-right:10px; padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
  .book-card .actions button.edit { background:#F5A623; color:white; }
  .book-card .actions button.save { background:#7ED321; color:white; }
  .book-card .actions button.cancel { background:#d9534f; color:white; }
  .alternatives { margin-top:10px; }
  .alternatives div { display:flex; align-items:center; margin-bottom:10px; cursor:pointer; border:1px solid #ccc; padding:5px; border-radius:5px; background:white; }
  .alternatives img { width:80px; height:auto; margin-right:15px; border-radius:5px; }
  .alternatives.selected { border:2px solid #4A90E2; }
  #logoutBtn { position:fixed; top:20px; right:20px; padding:10px 20px; background:#d9534f; color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>📚 My Book Club Dashboard</h1>
  <button id="logoutBtn">Logout</button>
</header>

<main>
  <h2>Submit Your Book</h2>
  <div id="submissionForm">
    <input type="text" id="bookTitle" placeholder="Book Title">
    <input type="text" id="bookAuthor" placeholder="Author Name">
    <input type="text" id="bookISBN" placeholder="ISBN (optional)">
    <button id="submitBookBtn">Submit Book</button>
    <div id="submissionMessage"></div>
  </div>

  <h2>Your Submitted Books</h2>
  <div id="submittedBooks"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, getDocs, updateDoc, query, where, serverTimestamp, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentSubmissionPeriod = null;

// Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

// Fuzzy matching helpers
function normalize(str){ return str.toLowerCase().replace(/[^a-z0-9]/g,'').trim(); }
function levenshtein(a,b){ const matrix=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0)); for(let i=0;i<=a.length;i++)matrix[i][0]=i;for(let j=0;j<=b.length;j++)matrix[0][j]=j;for(let i=1;i<=a.length;i++){for(let j=1;j<=b.length;j++){const cost=a[i-1]===b[j-1]?0:1;matrix[i][j]=Math.min(matrix[i-1][j]+1,matrix[i][j-1]+1,matrix[i-1][j-1]+cost);}}return matrix[a.length][b.length]; }
function similarity(a,b){ a=normalize(a); b=normalize(b); let longer=a.length>b.length?a:b; let shorter=a.length>b.length?b:a; if(!longer.length)return 1.0; return (longer.length-levenshtein(longer,shorter))/longer.length; }

async function fetchMatchedBook(title,author,isbn){
  let alternatives=[];
  // Try ISBN
  if(isbn){
    try{
      const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
      const data = await res.json();
      const key = `ISBN:${isbn}`;
      if(data[key]){
        alternatives.push({title:data[key].title||title,author:data[key].authors?.[0]?.name||author,coverUrl:data[key].cover?.medium||""});
      }
    }catch(e){console.error(e);}
  }
  // Search Open Library
  try{
    const res=await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=10`);
    const data=await res.json();
    if(data.docs.length>0){
      const scored=data.docs.map(doc=>{
        return {title:doc.title,author:doc.author_name?.[0]||"",coverUrl:doc.cover_i?`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`:"",score:(similarity(title,doc.title)+similarity(author,doc.author_name?.[0]||""))/2};
      });
      scored.sort((a,b)=>b.score-a.score);
      scored.forEach(s=>alternatives.push({title:s.title,author:s.author,coverUrl:s.coverUrl}));
    }
  }catch(e){console.error(e);}
  return { title: alternatives[0]?.title||title, author: alternatives[0]?.author||author, coverUrl: alternatives[0]?.coverUrl||"", alternatives };
}

// Track auth state
onAuthStateChanged(auth, async user=>{
  if(!user){ window.location.href="login.html"; return; }
  currentUser=user;
  initSubmissionPeriodListener();
});

// Listen for current open submission period
async function initSubmissionPeriodListener(){
  const periodsSnap = collection(db,"submissionsPeriods");
  onSnapshot(periodsSnap, snapshot=>{
    snapshot.forEach(docSnap=>{
      const data = docSnap.data();
      if(data.active) currentSubmissionPeriod={id:docSnap.id,...data};
    });
    renderSubmissionForm();
    loadUserBooks();
  });
}

// Render submission form based on current period
function renderSubmissionForm(){
  const submitBtn=document.getElementById("submitBookBtn");
  const messageDiv=document.getElementById("submissionMessage");
  if(!currentSubmissionPeriod){
    submitBtn.disabled=true;
    messageDiv.innerText="Submissions are currently closed.";
  }else{
    submitBtn.disabled=false;
    messageDiv.innerText="";
  }
}

// Submit book
document.getElementById("submitBookBtn").addEventListener("click", async ()=>{
  const title=document.getElementById("bookTitle").value.trim();
  const author=document.getElementById("bookAuthor").value.trim();
  const isbn=document.getElementById("bookISBN").value.trim();

  if(!title||!author){ document.getElementById("submissionMessage").innerText="Title and author are required."; return; }
  if(!currentSubmissionPeriod){ document.getElementById("submissionMessage").innerText="No active submission period."; return; }

  // Check if user already submitted in this period
  const q=query(collection(db,"books"),where("submittedBy","==",currentUser.uid),where("submissionPeriodId","==",currentSubmissionPeriod.id));
  const existing=await getDocs(q);
  if(!existing.empty){ document.getElementById("submissionMessage").innerText="You already submitted a book for this period."; return; }

  const matched=await fetchMatchedBook(title,author,isbn);
  try{
    await addDoc(collection(db,"books"),{
      title:matched.title,
      author:matched.author,
      coverUrl:matched.coverUrl,
      submittedBy:currentUser.uid,
      submissionPeriodId:currentSubmissionPeriod.id,
      createdAt:serverTimestamp(),
      alternatives:matched.alternatives
    });
    document.getElementById("submissionMessage").innerText=`Book "${matched.title}" submitted successfully!`;
    document.getElementById("bookTitle").value="";
    document.getElementById("bookAuthor").value="";
    document.getElementById("bookISBN").value="";
    loadUserBooks();
  }catch(e){console.error(e);}
});

// Load user's books
async function loadUserBooks(){
  const container=document.getElementById("submittedBooks");
  container.innerHTML="";
  const q=query(collection(db,"books"),where("submittedBy","==",currentUser.uid),orderBy("createdAt","desc"));
  const snap=await getDocs(q);
  snap.forEach(docSnap=>{
    const data=docSnap.data();
    const card=document.createElement("div");
    card.className="book-card";
    card.innerHTML=`<img src="${data.coverUrl||''}" alt="cover"><div class="info"><strong>${data.title}</strong><br>by ${data.author}</div><div class="actions"><button class="edit">Edit</button></div></div>`;
    container.appendChild(card);

    const editBtn=card.querySelector(".edit");
    editBtn.addEventListener("click", ()=>{
      showEditOptions(card,docSnap.id,data);
    });
  });
}

// Show inline edit options
function showEditOptions(card,bookId,data){
  card.innerHTML=`<img src="${data.coverUrl||''}" alt="cover"><div class="info"><strong>${data.title}</strong><br>by ${data.author}</div>`;
  const altDiv=document.createElement("div"); altDiv.className="alternatives"; card.appendChild(altDiv);

  data.alternatives.forEach((alt,i)=>{
    const option=document.createElement("div");
    option.innerHTML=`<img src="${alt.coverUrl||''}"><span>${alt.title} by ${alt.author}</span>`;
    option.addEventListener("click", async ()=>{
      await updateDoc(doc(db,"books",bookId),{title:alt.title,author:alt.author,coverUrl:alt.coverUrl});
      loadUserBooks();
    });
    altDiv.appendChild(option);
  });
}
</script>
</body>
</html>
