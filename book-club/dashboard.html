<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Club Dashboard</title>
</head>
<body>
  <h1>📚 Book Club Dashboard</h1>

  <!-- Book Submission Section -->
  <div id="submissionSection">
    <h2>Submit Your Book</h2>
    <input id="bookTitle" placeholder="Book Title" />
    <input id="bookAuthor" placeholder="Author Name" />
    <input id="bookISBN" placeholder="ISBN (optional)" />
    <button id="submitBookBtn">Submit Book</button>
    <div id="submissionMessage"></div>
  </div>

  <!-- Submitted Book History -->
  <h2>Your Submissions</h2>
  <div id="userBookHistory"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, getDocs, addDoc, doc, updateDoc, serverTimestamp, onSnapshot, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const configDoc = doc(db, "config", "settings");

    let currentUser = null;
    let submissionsOpen = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;

      // Listen for live config changes
      onSnapshot(configDoc, (snap) => {
        const data = snap.exists() ? snap.data() : {};
        submissionsOpen = data.submissionsOpen || false;
        document.getElementById("submissionMessage").innerText = submissionsOpen ? "Book submissions are OPEN" : "Book submissions are CLOSED";
        loadUserBooks();
      });
    });

    async function fetchBookInfo(isbn) {
      if (!isbn) return null;
      try {
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const data = await res.json();
        const key = `ISBN:${isbn}`;
        if (data[key]) {
          return {
            title: data[key].title || "",
            author: data[key].authors?.[0]?.name || "",
            coverUrl: data[key].cover?.medium || ""
          };
        }
      } catch (err) {
        console.error(err);
      }
      return null;
    }

    document.getElementById("submitBookBtn").addEventListener("click", async () => {
      if (!submissionsOpen) {
        document.getElementById("submissionMessage").innerText = "Book submissions are closed.";
        return;
      }

      // Check if user already submitted
      const q = query(collection(db, "books"), where("submittedBy", "==", currentUser.uid));
      const existing = await getDocs(q);
      if (!existing.empty) {
        document.getElementById("submissionMessage").innerText = "You have already submitted a book.";
        return;
      }

      const titleInput = document.getElementById("bookTitle").value.trim();
      const authorInput = document.getElementById("bookAuthor").value.trim();
      const isbnInput = document.getElementById("bookISBN").value.trim();

      if (!titleInput || !authorInput) {
        document.getElementById("submissionMessage").innerText = "Title and author are required.";
        return;
      }

      let title = titleInput;
      let author = authorInput;
      let coverUrl = "";

      if (isbnInput) {
        const info = await fetchBookInfo(isbnInput);
        if (info) {
          title = info.title || title;
          author = info.author || author;
          coverUrl = info.coverUrl || "";
        }
      }

      try {
        await addDoc(collection(db, "books"), {
          title,
          author,
          coverUrl,
          submittedBy: currentUser.uid,
          votes: 0,
          active: false,
          createdAt: serverTimestamp()
        });

        document.getElementById("submissionMessage").innerText = `Book "${title}" submitted successfully!`;
        document.getElementById("bookTitle").value = "";
        document.getElementById("bookAuthor").value = "";
        document.getElementById("bookISBN").value = "";

        loadUserBooks();
      } catch (err) {
        console.error(err);
        document.getElementById("submissionMessage").innerText = "Failed to submit book.";
      }
    });

    async function loadUserBooks() {
      const q = query(collection(db, "books"), where("submittedBy", "==", currentUser.uid));
      const snapshot = await getDocs(q);
      const container = document.getElementById("userBookHistory");
      container.innerHTML = "";

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.innerHTML = `
          <img src="${data.coverUrl || ''}" alt="Cover" style="width:80px;height:auto;" />
          <strong>${data.title}</strong> by ${data.author}
          ${submissionsOpen ? `<input class="editTitle" value="${data.title}" placeholder="Edit title" />
          <input class="editAuthor" value="${data.author}" placeholder="Edit author" />
          <input class="editISBN" placeholder="Edit ISBN" />
          <button class="saveEdit">Save</button>` : ""}
          <hr>
        `;
        container.appendChild(div);

        if (submissionsOpen) {
          div.querySelector(".saveEdit").addEventListener("click", async () => {
            let updatedTitle = div.querySelector(".editTitle").value.trim();
            let updatedAuthor = div.querySelector(".editAuthor").value.trim();
            let isbn = div.querySelector(".editISBN").value.trim();
            let coverUrl = data.coverUrl;

            if (isbn) {
              const info = await fetchBookInfo(isbn);
              if (info) {
                updatedTitle = info.title || updatedTitle;
                updatedAuthor = info.author || updatedAuthor;
                coverUrl = info.coverUrl || coverUrl;
              }
            }

            await updateDoc(doc(db, "books", docSnap.id), {
              title: updatedTitle,
              author: updatedAuthor,
              coverUrl
            });

            loadUserBooks();
          });
        }
      });
    }

  </script>
</body>
</html>
