<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Club Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:0; }
header { background:#4A90E2; color:white; padding:20px; display:flex; justify-content:space-between; align-items:center; }
header button { padding:10px 20px; background:#d9534f; color:white; border:none; border-radius:5px; cursor:pointer; }
main { max-width:1000px; margin:20px auto; background:white; padding:20px; border-radius:10px; }
h1,h2,h3 { margin-top:0; }
input, select { padding:10px; margin:5px 0; width:100%; max-width:400px; }
button { padding:8px 15px; margin:5px; border:none; border-radius:5px; cursor:pointer; }
button.primary { background:#4A90E2; color:white; }
button.secondary { background:#7ED321; color:white; }
.submission-card { display:flex; align-items:center; background:#eef; padding:10px; margin:10px 0; border-radius:8px; flex-wrap:wrap; }
.submission-card img { width:150px; margin-right:15px; border-radius:5px; }
.submission-card .info { flex:1; min-width:200px; }
.alternatives { margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; }
.alternatives div { cursor:pointer; padding:5px; border:1px solid #ccc; border-radius:5px; display:flex; align-items:center; background:white; }
.alternatives img { width:80px; margin-right:10px; border-radius:5px; }
#matchTool { margin-top:20px; background:#f9f9f9; padding:10px; border-radius:8px; }
</style>
</head>
<body>

<header>
<h1>📚 My Dashboard!</h1>
<button id="logoutBtn">Logout</button>
</header>

<main>
<h2>Submit a Book</h2>
<div id="submissionSection">
<input id="bookTitle" placeholder="Book Title">
<input id="bookAuthor" placeholder="Author Name">
<input id="bookISBN" placeholder="ISBN (optional)">
<button id="submitBookBtn" class="primary">Submit Book</button>
<div id="submissionMessage"></div>
<div id="matchTool"></div>
</div>

<h2>My Submissions</h2>
<div id="mySubmissionsContainer"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, doc, addDoc, getDocs, updateDoc, onSnapshot, query, where, orderBy, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
let activePeriod=null;

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href="login.html";
});

// Protect page
onAuthStateChanged(auth, async user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;
  listenActivePeriod();
  loadMySubmissions();
});

// Listen for active submission period
function listenActivePeriod(){
  onSnapshot(collection(db,"submissionsPeriods"), snapshot=>{
    activePeriod=null;
    snapshot.forEach(docSnap=>{ if(docSnap.data().active) activePeriod={id:docSnap.id,...docSnap.data()}; });
    updateSubmissionSection();
  });
}

function updateSubmissionSection(){
  const sec=document.getElementById("submissionSection");
  if(activePeriod){
    sec.style.display="block";
  } else {
    sec.style.display="none";
  }
}

// Submit book with matching
document.getElementById("submitBookBtn").addEventListener("click", async ()=>{
  if(!activePeriod) return;
  const titleInput=document.getElementById("bookTitle").value.trim();
  const authorInput=document.getElementById("bookAuthor").value.trim();
  const isbnInput=document.getElementById("bookISBN").value.trim();
  if(!titleInput||!authorInput){ document.getElementById("submissionMessage").innerText="Title and author required."; return; }

  // Fetch matching books
  const matches = await fetchBookMatches(titleInput,authorInput,isbnInput);
  showMatchTool(matches,titleInput,authorInput,isbnInput);
});

// Simulate matching via OpenLibrary API
async function fetchBookMatches(title,author,isbn){
  if(isbn){
    try{
      const res=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
      const data=await res.json();
      const key=`ISBN:${isbn}`;
      if(data[key]) return [{title:data[key].title,author:data[key].authors?.[0]?.name,coverUrl:data[key].cover?.medium||""}];
    }catch(e){console.error(e);}
  }
  // fallback: simple search API
  const searchUrl=`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=5`;
  try{
    const res=await fetch(searchUrl);
    const data=await res.json();
    return data.docs.slice(0,5).map(d=>({
      title:d.title,
      author:d.author_name?.[0]||author,
      coverUrl:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:""
    }));
  }catch(e){console.error(e);}
  return [{title,author,coverUrl:""}];
}

// Show match tool
function showMatchTool(matches,titleInput,authorInput,isbnInput){
  const tool=document.getElementById("matchTool");
  tool.innerHTML="<h3>Confirm or Edit Match</h3>";
  matches.forEach(match=>{
    const div=document.createElement("div");
    div.className="alternatives";
    div.innerHTML=`<div><img src="${match.coverUrl||''}"><span>${match.title} by ${match.author}</span></div>`;
    div.querySelector("div").addEventListener("click", async ()=>{
      await addDoc(collection(db,"books"),{
        title:match.title,
        author:match.author,
        coverUrl:match.coverUrl,
        submittedBy:currentUser.uid,
        submissionPeriodId:activePeriod.id,
        votes:0,
        createdAt:serverTimestamp()
      });
      tool.innerHTML="<p>Book submitted!</p>";
      loadMySubmissions();
    });
    tool.appendChild(div);
  });
}

// Load user's submissions
function loadMySubmissions(){
  const container=document.getElementById("mySubmissionsContainer");
  const q=query(collection(db,"books"),where("submittedBy","==",currentUser.uid),orderBy("createdAt","desc"));
  onSnapshot(q, snap=>{
    container.innerHTML="";
    snap.forEach(docSnap=>{
      const b=docSnap.data();
      const card=document.createElement("div"); card.className="submission-card";
      card.innerHTML=`<img src="${b.coverUrl||''}"><div class="info"><strong>${b.title}</strong><br>by ${b.author}</div>`;
      container.appendChild(card);
    });
  });
}
</script>
</body>
</html>
