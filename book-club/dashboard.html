<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Club Dashboard</title>
  <style>
    .book-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; align-items: flex-start; gap: 10px; }
    .book-card img { width: 80px; height: auto; }
    .edit-options { display: flex; flex-direction: column; margin-top: 5px; }
    .edit-option { cursor: pointer; margin: 2px 0; padding: 2px; border: 1px solid #aaa; }
  </style>
</head>
<body>
  <h1>📚 Book Club Dashboard</h1>

  <p id="submissionStatus">Checking submissions status...</p>

  <div id="bookSubmissionForm">
    <h2>Submit a Book</h2>
    <input id="bookTitle" placeholder="Book Title">
    <input id="bookAuthor" placeholder="Author Name">
    <input id="bookISBN" placeholder="ISBN (optional)">
    <button id="submitBookBtn">Submit Book</button>
    <div id="bookMessage"></div>
  </div>

  <h2>Your Book Submissions</h2>
  <div id="userBooksContainer"></div>

  <button id="logoutBtn">Log Out</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, addDoc, doc, updateDoc, serverTimestamp, query, where 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentPeriodDoc = null;
    const submissionStatusP = document.getElementById("submissionStatus");

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Protect page
    let currentUser = null;
    onAuthStateChanged(auth, async user => {
      if (!user) return window.location.href = "login.html";
      currentUser = user;
      await loadSubmissionPeriod();
      loadUserBooks();
    });

    // Load current submission period
    async function loadSubmissionPeriod() {
      const periodsSnap = await getDocs(collection(db, "submissionPeriods"));
      currentPeriodDoc = periodsSnap.docs.find(d => d.data().open) || null;
      submissionStatusP.innerText = currentPeriodDoc ? "Submissions are OPEN" : "Submissions are CLOSED";
      document.getElementById("bookSubmissionForm").style.display = currentPeriodDoc ? "block" : "none";
    }

    // Fetch book info from Open Library API
    async function fetchBookInfo(isbn) {
      if (!isbn) return null;
      try {
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const data = await res.json();
        const key = `ISBN:${isbn}`;
        if (data[key]) {
          return {
            title: data[key].title || "",
            author: data[key].authors?.[0]?.name || "",
            coverUrl: data[key].cover?.medium || "",
            description: data[key].description?.value || ""
          };
        }
      } catch (err) { console.error(err); }
      return null;
    }

    // Submit book
    document.getElementById("submitBookBtn").addEventListener("click", async () => {
      if (!currentPeriodDoc) return alert("Submissions are closed.");

      // Check if user already submitted in this period
      const booksQuery = query(
        collection(db, "books"),
        where("submittedBy", "==", currentUser.uid),
        where("periodId", "==", currentPeriodDoc.id)
      );
      const booksSnap = await getDocs(booksQuery);
      if (!booksSnap.empty) return alert("You have already submitted a book for this period.");

      const titleInput = document.getElementById("bookTitle").value.trim();
      const authorInput = document.getElementById("bookAuthor").value.trim();
      const isbnInput = document.getElementById("bookISBN").value.trim();

      if (!titleInput || !authorInput) return alert("Title and author required.");

      let title = titleInput;
      let author = authorInput;
      let coverUrl = "";
      let description = "";

      if (isbnInput) {
        const info = await fetchBookInfo(isbnInput);
        if (info) {
          title = info.title || title;
          author = info.author || author;
          coverUrl = info.coverUrl || "";
          description = info.description || "";
        }
      }

      await addDoc(collection(db, "books"), {
        title, author, coverUrl, description,
        submittedBy: currentUser.uid,
        periodId: currentPeriodDoc.id,
        votes: 0,
        active: false,
        createdAt: serverTimestamp()
      });

      document.getElementById("bookMessage").innerText = `Book "${title}" submitted successfully!`;
      document.getElementById("bookTitle").value = "";
      document.getElementById("bookAuthor").value = "";
      document.getElementById("bookISBN").value = "";
      loadUserBooks();
    });

    // Load user's books
    async function loadUserBooks() {
      const booksQuery = query(
        collection(db, "books"),
        where("submittedBy", "==", currentUser.uid)
      );
      const booksSnap = await getDocs(booksQuery);
      const container = document.getElementById("userBooksContainer");
      container.innerHTML = "";

      if (booksSnap.empty) return container.innerHTML = "<p>No submissions yet.</p>";

      booksSnap.docs.forEach(b => {
        const data = b.data();
        const div = document.createElement("div");
        div.classList.add("book-card");

        div.innerHTML = `
          <div>
            ${data.coverUrl ? `<img src="${data.coverUrl}" alt="Cover">` : ""}
          </div>
          <div>
            <strong>${data.title}</strong> by ${data.author}<br>
            <p>${data.description || ""}</p>
            <button class="editBtn">Edit Match</button>
          </div>
        `;
        container.appendChild(div);

        div.querySelector(".editBtn").addEventListener("click", () => {
          showEditOptions(div, b);
        });
      });
    }

    // Show edit options on page
    async function showEditOptions(div, bookDoc) {
      const data = bookDoc.data();
      const editDiv = document.createElement("div");
      editDiv.classList.add("edit-options");

      const alternativeMatches = [];

      // Try fetching by title
      try {
        const searchTitle = encodeURIComponent(data.title);
        const res = await fetch(`https://openlibrary.org/search.json?title=${searchTitle}&limit=5`);
        const result = await res.json();
        if (result.docs?.length) {
          result.docs.forEach(doc => {
            alternativeMatches.push({
              title: doc.title,
              author: doc.author_name?.[0] || "",
              coverUrl: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : "",
              key: doc.key
            });
          });
        }
      } catch (err) { console.error(err); }

      alternativeMatches.forEach(match => {
        const optDiv = document.createElement("div");
        optDiv.classList.add("edit-option");
        optDiv.innerHTML = `
          ${match.coverUrl ? `<img src="${match.coverUrl}" style="width:50px;">` : ""}
          <strong>${match.title}</strong> by ${match.author}
        `;
        optDiv.addEventListener("click", async () => {
          await updateDoc(bookDoc.ref, {
            title: match.title,
            author: match.author,
            coverUrl: match.coverUrl || "",
          });
          editDiv.remove();
          loadUserBooks();
        });
        editDiv.appendChild(optDiv);
      });

      div.appendChild(editDiv);
    }
  </script>
</body>
</html>
