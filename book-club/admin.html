<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Book Club</title>
</head>
<body>
  <h1>📚 Admin Panel</h1>
  <button id="logoutBtn">Log Out</button>
  <hr>

  <!-- Pending Members -->
  <div id="pendingMembers"></div>
  <hr>

  <!-- Submission Controls -->
  <h2>Submission Period</h2>
  <button id="startSubmissions">Start Book Submissions</button>
  <button id="closeSubmissions">Close Book Submissions</button>
  <p id="submissionStatus"></p>
  <hr>

  <!-- Voting Controls -->
  <button id="startVoting">Start Voting</button>
  <button id="closeVoting">Close Voting</button>
  <hr>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, addDoc, updateDoc, doc, onSnapshot, serverTimestamp, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Log Out Button
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Protect page: admin only
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      const membersSnap = await getDocs(collection(db, "members"));
      const admin = membersSnap.docs.find(d => d.id === user.uid && d.data().role === "admin");
      if (!admin) {
        alert("Admin access only.");
        await signOut(auth);
        window.location.href = "login.html";
      } else {
        loadPendingMembers();
        listenSubmissionStatus();
      }
    });

    // Pending members
    async function loadPendingMembers() {
      const membersSnap = await getDocs(collection(db, "members"));
      const pending = membersSnap.docs.filter(d => !d.data().approved && d.data().role !== "admin");
      const container = document.getElementById("pendingMembers");
      container.innerHTML = "<h2>Pending Members</h2>";
      if (!pending.length) {
        container.innerHTML += "<p>No pending members.</p>";
        return;
      }
      pending.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.innerHTML = `
          ${data.name || "(No name)"} (${data.email})
          <button class="approveBtn">Approve</button>
          <button class="denyBtn">Deny</button>
          <hr>
        `;
        container.appendChild(div);

        div.querySelector(".approveBtn").addEventListener("click", async () => {
          await updateDoc(doc(db, "members", docSnap.id), { approved: true });
          div.remove();
        });

        div.querySelector(".denyBtn").addEventListener("click", async () => {
          await deleteDoc(doc(db, "members", docSnap.id));
          div.remove();
        });
      });
    }

    // Submission period
    const submissionStatusP = document.getElementById("submissionStatus");
    const submissionPeriodsCol = collection(db, "submissionPeriods");

    async function startSubmissions() {
      await addDoc(submissionPeriodsCol, { open: true, createdAt: serverTimestamp() });
    }
    async function closeSubmissions() {
      // Find current open period and close it
      const snap = await getDocs(submissionPeriodsCol);
      snap.docs.forEach(async d => { if (d.data().open) await updateDoc(doc(db, "submissionPeriods", d.id), { open: false }); });
    }

    document.getElementById("startSubmissions").addEventListener("click", startSubmissions);
    document.getElementById("closeSubmissions").addEventListener("click", closeSubmissions);

    // Real-time update of submission status
    function listenSubmissionStatus() {
      onSnapshot(submissionPeriodsCol, snap => {
        const openPeriod = snap.docs.find(d => d.data().open);
        submissionStatusP.innerText = openPeriod ? "Submissions are OPEN" : "Submissions are CLOSED";
      });
    }

  </script>
</body>
</html>
