<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Book Club</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background:#f5f5f5; }
    h1 { color:#333; }
    button { margin:5px; padding:8px 12px; cursor:pointer; }
    .section { background:white; padding:15px; margin-bottom:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .book-card { display:flex; align-items:center; margin:10px 0; }
    .book-card img { width:80px; height:120px; object-fit:cover; margin-right:10px; border-radius:4px; }
    .book-actions button { margin-left:5px; }
    .submission-period { border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px; }
    .submissions-list { margin-left:20px; margin-top:10px; }
    input { padding:5px; margin-right:5px; }
  </style>
</head>
<body>
  <h1>📚 Admin Panel!!</h1>

  <!-- Submission Period Controls -->
  <div class="section">
    <h2>Manage Submission Periods</h2>
    <input id="newPeriodName" placeholder="Submission Period Name" />
    <button id="createPeriodBtn">Create Submission Period</button>
    <div id="periodsContainer"></div>
  </div>

  <!-- Pending Members Section -->
  <div class="section">
    <h2>Pending Members</h2>
    <div id="pendingMembers"></div>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, doc, addDoc, getDocs, updateDoc, deleteDoc, serverTimestamp, onSnapshot, query, orderBy 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const adminUID = "sog7PT2TXTTqqXQFvG2j63blC6f1"; // your admin UID

// Protect page
onAuthStateChanged(auth, async (user) => {
  if (!user || user.uid !== adminUID) {
    alert("Admin access only.");
    signOut(auth);
    window.location.href = "login.html";
  } else {
    loadPendingMembers();
    loadSubmissionPeriods();
  }
});

// Pending Members
async function loadPendingMembers() {
  const membersSnap = await getDocs(collection(db, "members"));
  const pendingMembers = membersSnap.docs.filter(d => !d.data().approved && d.data().role !== "admin");
  const container = document.getElementById("pendingMembers");
  container.innerHTML = "";
  if(pendingMembers.length === 0) container.innerHTML = "<p>No pending members.</p>";

  pendingMembers.forEach(docSnap => {
    const data = docSnap.data();
    const div = document.createElement("div");
    div.innerHTML = `${data.name || "(No Name)"} (${data.email}) 
      <button class="approveBtn">Approve</button> 
      <button class="denyBtn">Deny</button>`;
    container.appendChild(div);

    div.querySelector(".approveBtn").addEventListener("click", async () => {
      await updateDoc(doc(db, "members", docSnap.id), { approved:true });
      div.remove();
    });
    div.querySelector(".denyBtn").addEventListener("click", async () => {
      await deleteDoc(doc(db, "members", docSnap.id));
      div.remove();
    });
  });
}

// Submission Periods
const periodsContainer = document.getElementById("periodsContainer");

document.getElementById("createPeriodBtn").addEventListener("click", async () => {
  const name = document.getElementById("newPeriodName").value.trim();
  if(!name) return;
  await addDoc(collection(db,"submissionsPeriods"),{name,active:false,createdAt:serverTimestamp()});
  document.getElementById("newPeriodName").value = "";
});

function loadSubmissionPeriods(){
  const q = query(collection(db,"submissionsPeriods"), orderBy("createdAt","desc"));
  onSnapshot(q, (snap) => {
    periodsContainer.innerHTML = "";
    snap.docs.forEach(docSnap => {
      const data = docSnap.data();
      const div = document.createElement("div");
      div.className = "submission-period";
      div.innerHTML = `
        <strong>${data.name || "(Unnamed)"}</strong> 
        <button class="toggleBtn">${data.active ? "Close Submissions" : "Start Submissions"}</button>
        <button class="editBtn">Edit Name</button>
        <button class="deleteBtn">Delete Period</button>
        <button class="seeSubsBtn">See Submissions</button>
        <div class="submissions-list" style="display:none;"></div>
      `;
      periodsContainer.appendChild(div);

      const toggleBtn = div.querySelector(".toggleBtn");
      toggleBtn.addEventListener("click", async ()=>{
        await updateDoc(doc(db,"submissionsPeriods",docSnap.id),{active:!data.active});
      });

      const editBtn = div.querySelector(".editBtn");
      editBtn.addEventListener("click", async ()=>{
        const newName = prompt("Enter new name for this period:",data.name);
        if(newName) await updateDoc(doc(db,"submissionsPeriods",docSnap.id),{name:newName});
      });

      const deleteBtn = div.querySelector(".deleteBtn");
      deleteBtn.addEventListener("click", async ()=>{
        // Delete all books in this period first
        const booksSnap = await getDocs(collection(db,"books"));
        for(let b of booksSnap.docs){
          if(b.data().submissionPeriodId === docSnap.id) await deleteDoc(doc(db,"books",b.id));
        }
        await deleteDoc(doc(db,"submissionsPeriods",docSnap.id));
      });

      const seeSubsBtn = div.querySelector(".seeSubsBtn");
      const submissionsList = div.querySelector(".submissions-list");
      seeSubsBtn.addEventListener("click", async ()=>{
        submissionsList.style.display = submissionsList.style.display==="none"?"block":"none";
        if(submissionsList.style.display==="block"){
          submissionsList.innerHTML = "";
          const booksSnap = await getDocs(collection(db,"books"));
          booksSnap.docs
            .filter(b=>b.data().submissionPeriodId===docSnap.id)
            .forEach(b => {
              const book = b.data();
              const userSnap = await getDocs(doc(db,"members",book.submittedBy)).catch(()=>null);
              const userName = userSnap?.data()?.name || book.submittedBy;
              const bookDiv = document.createElement("div");
              bookDiv.className="book-card";
              bookDiv.innerHTML = `
                <img src="${book.coverUrl||''}" />
                <div>
                  <strong>${book.title}</strong><br/>
                  ${book.author}<br/>
                  by: ${userName}<br/>
                  <button class="editBookBtn">Edit</button>
                  <button class="deleteBookBtn">Delete</button>
                </div>
              `;
              submissionsList.appendChild(bookDiv);

              bookDiv.querySelector(".deleteBookBtn").addEventListener("click",async ()=>{
                await deleteDoc(doc(db,"books",b.id));
                bookDiv.remove();
              });

              bookDiv.querySelector(".editBookBtn").addEventListener("click",async ()=>{
                const newTitle = prompt("Enter new title:",book.title);
                const newAuthor = prompt("Enter new author:",book.author);
                await updateDoc(doc(db,"books",b.id),{title:newTitle,author:newAuthor});
              });
            });
        }
      });
    });
  });
}
  </script>
</body>
</html>
