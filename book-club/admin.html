<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Book Club</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h2 { margin-top: 30px; }
    .period { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
    .book { display: flex; align-items: center; margin: 10px 0; }
    .book img { width: 60px; height: auto; margin-right: 10px; }
    .book-info { flex: 1; }
    button { margin-left: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>📚 Admin Panel</h1>
  <button id="logoutBtn">Log Out</button>

  <!-- Pending Members Section -->
  <div id="pendingMembers"></div>
  <hr>

  <!-- Submission Period Controls -->
  <h2>Submission Periods</h2>
  <div id="periodsContainer"></div>
  <button id="createPeriodBtn">Create New Submission Period</button>
  <hr>

  <!-- Add Book for Member -->
  <h2>Add Book for Member</h2>
  <select id="memberSelect"><option>Loading members...</option></select><br><br>
  <input id="bookTitle" placeholder="Book Title">
  <input id="bookAuthor" placeholder="Author Name">
  <input id="bookISBN" placeholder="ISBN (optional)">
  <select id="periodSelect"><option>Loading periods...</option></select>
  <button id="addBookBtn">Add Book</button>
  <div id="bookMessage"></div>
  <hr>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, addDoc, serverTimestamp, query, where, orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const adminUid = "sog7PT2TXTTqqXQFvG2j63blC6f1";

    // Log out
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Admin Page Protection
    onAuthStateChanged(auth, async (user) => {
      if (!user || user.uid !== adminUid) {
        alert("Admin access only.");
        signOut(auth);
        window.location.href = "login.html";
        return;
      }
      loadPendingMembers();
      loadMembersDropdown();
      loadSubmissionPeriods();
    });

    // ----------------- Pending Members -----------------
    async function loadPendingMembers() {
      const membersSnap = await getDocs(collection(db, "members"));
      const pendingMembers = membersSnap.docs.filter(d => !d.data().approved && d.data().role !== "admin");
      const container = document.getElementById("pendingMembers");
      container.innerHTML = "<h2>Pending Members</h2>";

      if (pendingMembers.length === 0) {
        container.innerHTML += "<p>No pending members.</p>";
        return;
      }

      pendingMembers.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.innerHTML = `
          ${data.name || "(No name)"} (${data.email})
          <button class="approveBtn">Approve</button>
          <button class="denyBtn">Deny</button>
        `;
        container.appendChild(div);

        div.querySelector(".approveBtn").addEventListener("click", async () => {
          await updateDoc(doc(db, "members", docSnap.id), { approved: true });
          div.remove();
        });

        div.querySelector(".denyBtn").addEventListener("click", async () => {
          await deleteDoc(doc(db, "members", docSnap.id));
          div.remove();
        });
      });
    }

    // ----------------- Members Dropdown for Add Book -----------------
    async function loadMembersDropdown() {
      const memberSnap = await getDocs(collection(db, "members"));
      const select = document.getElementById("memberSelect");
      select.innerHTML = "";
      memberSnap.docs.forEach(d => {
        if (d.data().approved) {
          const option = document.createElement("option");
          option.value = d.id;
          option.textContent = d.data().name || d.data().email;
          select.appendChild(option);
        }
      });
    }

    // ----------------- Submission Periods -----------------
    async function loadSubmissionPeriods() {
      const periodsSnap = await getDocs(collection(db, "submissionPeriods"));
      const container = document.getElementById("periodsContainer");
      const periodSelect = document.getElementById("periodSelect");
      container.innerHTML = "";
      periodSelect.innerHTML = "";

      periodsSnap.docs.sort((a,b) => a.data().start?.toMillis() - b.data().start?.toMillis());

      periodsSnap.docs.forEach(periodDoc => {
        const period = periodDoc.data();
        const startDate = period.start?.toDate().toLocaleString() || "Unknown start";
        const endDate = period.end?.toDate().toLocaleString() || "Open";

        // Display period in admin list
        const periodDiv = document.createElement("div");
        periodDiv.className = "period";
        periodDiv.innerHTML = `
          <strong>${startDate} - ${endDate}</strong>
          <button class="toggleBtn">${period.open ? "Close" : "Open"}</button>
          <div class="booksContainer hidden"></div>
        `;
        container.appendChild(periodDiv);

        // Add period to add book select
        const opt = document.createElement("option");
        opt.value = periodDoc.id;
        opt.textContent = `${startDate} - ${endDate}`;
        periodSelect.appendChild(opt);

        // Toggle period open/close
        periodDiv.querySelector(".toggleBtn").addEventListener("click", async () => {
          await updateDoc(doc(db, "submissionPeriods", periodDoc.id), { open: !period.open });
          loadSubmissionPeriods(); // Refresh
        });

        // Load books for this period
        const booksContainer = periodDiv.querySelector(".booksContainer");
        periodDiv.addEventListener("click", async () => {
          booksContainer.classList.toggle("hidden");
          if (!booksContainer.classList.contains("hidden")) {
            booksContainer.innerHTML = "";
            const booksQuery = query(
              collection(db, "books"),
              where("periodId","==", periodDoc.id),
              orderBy("createdAt")
            );
            const booksSnap = await getDocs(booksQuery);
            booksSnap.docs.forEach(bookDoc => {
              const b = bookDoc.data();
              const div = document.createElement("div");
              div.className = "book";
              div.innerHTML = `
                <img src="${b.coverUrl || ''}" alt="Cover">
                <div class="book-info">
                  <strong>${b.title}</strong> by ${b.author} <br>
                  Submitted by: ${b.submittedByName || "Unknown"}
                </div>
                <button class="editBookBtn">Edit</button>
                <button class="deleteBookBtn">Delete</button>
              `;
              booksContainer.appendChild(div);

              // Edit Book (placeholder, implement match editor)
              div.querySelector(".editBookBtn").addEventListener("click", () => {
                alert("Edit book feature goes here (match editor with cover selection).");
              });

              // Delete Book
              div.querySelector(".deleteBookBtn").addEventListener("click", async () => {
                await deleteDoc(doc(db, "books", bookDoc.id));
                div.remove();
              });
            });
          }
        });
      });
    }

    // ----------------- Add Book for Member -----------------
    document.getElementById("addBookBtn").addEventListener("click", async () => {
      const memberId = document.getElementById("memberSelect").value;
      const periodId = document.getElementById("periodSelect").value;
      const titleInput = document.getElementById("bookTitle").value.trim();
      const authorInput = document.getElementById("bookAuthor").value.trim();
      const isbnInput = document.getElementById("bookISBN").value.trim();

      if (!titleInput || !authorInput || !memberId || !periodId) {
        document.getElementById("bookMessage").innerText = "All fields are required.";
        return;
      }

      // Fetch book info from Open Library
      let title = titleInput;
      let author = authorInput;
      let coverUrl = "";
      if (isbnInput) {
        try {
          const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbnInput}&format=json&jscmd=data`);
          const data = await res.json();
          const key = `ISBN:${isbnInput}`;
          if (data[key]) {
            title = data[key].title || title;
            author = data[key].authors?.[0]?.name || author;
            coverUrl = data[key].cover?.medium || "";
          }
        } catch (err) {
          console.error("Error fetching book info:", err);
        }
      }

      try {
        await addDoc(collection(db, "books"), {
          title,
          author,
          coverUrl,
          periodId,
          submittedBy: memberId,
          submittedByName: document.getElementById("memberSelect").selectedOptions[0].textContent,
          votes: 0,
          active: false,
          createdAt: serverTimestamp()
        });
        document.getElementById("bookMessage").innerText = `Book "${title}" added successfully for member.`;
        document.getElementById("bookTitle").value = "";
        document.getElementById("bookAuthor").value = "";
        document.getElementById("bookISBN").value = "";
      } catch (err) {
        console.error("Error adding book:", err);
        document.getElementById("bookMessage").innerText = "Failed to add book. Check console.";
      }
    });

    // ----------------- Create New Submission Period -----------------
    document.getElementById("createPeriodBtn").addEventListener("click", async () => {
      const now = new Date();
      const periodDoc = await addDoc(collection(db, "submissionPeriods"), {
        open: true,
        start: serverTimestamp(),
        end: null
      });
      loadSubmissionPeriods();
    });

  </script>
</body>
</html>
