<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Book Club</title>
  <style>
    .period-card { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
    .book-card { border: 1px solid #aaa; margin: 5px 0; padding: 5px; display: flex; gap: 10px; align-items: flex-start; }
    .book-card img { width: 80px; height: auto; }
    .edit-options { margin-top: 5px; display: flex; flex-direction: column; }
    .edit-option { cursor: pointer; margin: 2px 0; padding: 2px; border: 1px solid #888; }
  </style>
</head>
<body>
  <h1>📚 Admin Panel</h1>

  <h2>Submission Periods</h2>
  <div id="submissionPeriodsContainer"></div>
  <hr>

  <h2>Add Book for Member</h2>
  <select id="selectMember"></select>
  <select id="selectPeriod"></select>
  <input id="bookTitle" placeholder="Book Title">
  <input id="bookAuthor" placeholder="Author Name">
  <input id="bookISBN" placeholder="ISBN (optional)">
  <button id="addBookForMemberBtn">Add Book for Member</button>
  <div id="addBookMessage"></div>

  <button id="logoutBtn">Log Out</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, addDoc, serverTimestamp, query, where, orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let membersList = [];
    let periodsList = [];

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Protect admin page
    onAuthStateChanged(auth, async user => {
      if (!user) return window.location.href = "login.html";

      const membersSnap = await getDocs(collection(db, "members"));
      const admin = membersSnap.docs.find(d => d.id === user.uid && d.data().role === "admin");
      if (!admin) {
        alert("Admin access only.");
        auth.signOut();
        window.location.href = "login.html";
      } else {
        membersList = membersSnap.docs.filter(d => d.data().role !== "admin").map(d => ({ id: d.id, name: d.data().name }));
        loadMembersDropdown();
        loadPeriods();
      }
    });

    async function loadMembersDropdown() {
      const select = document.getElementById("selectMember");
      select.innerHTML = "<option value=''>Select Member</option>";
      membersList.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.name;
        select.appendChild(opt);
      });
    }

    async function loadPeriods() {
      const periodsSnap = await getDocs(collection(db, "submissionPeriods"));
      periodsList = periodsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const selectPeriod = document.getElementById("selectPeriod");
      selectPeriod.innerHTML = "<option value=''>Select Period</option>";
      periodsList.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name || `Period ${p.id}`;
        selectPeriod.appendChild(opt);
      });

      renderPeriodsList();
    }

    async function renderPeriodsList() {
      const container = document.getElementById("submissionPeriodsContainer");
      container.innerHTML = "";
      for (const period of periodsList) {
        const periodDiv = document.createElement("div");
        periodDiv.classList.add("period-card");
        periodDiv.innerHTML = `<strong>${period.name || "Unnamed Period"}</strong> - ${period.open ? "OPEN" : "CLOSED"} <button class="toggleBtn">${period.open ? "Close" : "Open"}</button>`;

        const booksContainer = document.createElement("div");
        booksContainer.style.display = "none";
        periodDiv.appendChild(booksContainer);

        periodDiv.querySelector(".toggleBtn").addEventListener("click", async () => {
          await updateDoc(doc(db, "submissionPeriods", period.id), { open: !period.open });
          period.open = !period.open;
          renderPeriodsList();
        });

        periodDiv.addEventListener("click", async () => {
          if (booksContainer.style.display === "none") {
            booksContainer.style.display = "block";
            await loadBooksForPeriod(period.id, booksContainer);
          } else {
            booksContainer.style.display = "none";
          }
        });

        container.appendChild(periodDiv);
      }
    }

    async function loadBooksForPeriod(periodId, container) {
      container.innerHTML = "";
      const booksQuery = query(collection(db, "books"), where("periodId", "==", periodId), orderBy("createdAt"));
      const booksSnap = await getDocs(booksQuery);

      if (booksSnap.empty) {
        container.innerHTML = "<p>No submissions for this period.</p>";
        return;
      }

      booksSnap.docs.forEach(async b => {
        const data = b.data();
        const memberName = membersList.find(m => m.id === data.submittedBy)?.name || data.submittedBy;

        const div = document.createElement("div");
        div.classList.add("book-card");
        div.innerHTML = `
          <div>${data.coverUrl ? `<img src="${data.coverUrl}">` : ""}</div>
          <div>
            <strong>${data.title}</strong> by ${data.author}<br>
            Submitted by: ${memberName}<br>
            <button class="editBtn">Edit</button>
            <button class="deleteBtn">Delete</button>
          </div>
        `;
        container.appendChild(div);

        div.querySelector(".deleteBtn").addEventListener("click", async () => {
          await deleteDoc(doc(db, "books", b.id));
          div.remove();
        });

        div.querySelector(".editBtn").addEventListener("click", () => {
          showEditOptions(div, b);
        });
      });
    }

    // Edit options like dashboard
    async function showEditOptions(div, bookDoc) {
      const data = bookDoc.data();
      const editDiv = document.createElement("div");
      editDiv.classList.add("edit-options");
      div.appendChild(editDiv);

      const alternatives = [];
      try {
        const searchTitle = encodeURIComponent(data.title);
        const res = await fetch(`https://openlibrary.org/search.json?title=${searchTitle}&limit=3`);
        const result = await res.json();
        if (result.docs?.length) {
          result.docs.forEach(doc => {
            alternatives.push({
              title: doc.title,
              author: doc.author_name?.[0] || "",
              coverUrl: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : "",
              key: doc.key
            });
          });
        }
      } catch (err) { console.error(err); }

      function renderAlternatives(startIndex = 0) {
        editDiv.innerHTML = "";
        alternatives.slice(startIndex, startIndex + 3).forEach(match => {
          const optDiv = document.createElement("div");
          optDiv.classList.add("edit-option");
          optDiv.innerHTML = `${match.coverUrl ? `<img src="${match.coverUrl}" style="width:50px;">` : ""} <strong>${match.title}</strong> by ${match.author}`;
          optDiv.addEventListener("click", async () => {
            await updateDoc(bookDoc.ref, {
              title: match.title,
              author: match.author,
              coverUrl: match.coverUrl || "",
            });
            editDiv.remove();
            renderPeriodsList();
          });
          editDiv.appendChild(optDiv);
        });

        if (alternatives.length > 3) {
          const nextBtn = document.createElement("button");
          nextBtn.textContent = "Next 3 Options";
          nextBtn.addEventListener("click", () => renderAlternatives(3));
          editDiv.appendChild(nextBtn);
        }
      }

      renderAlternatives();
    }

    // Add book for member
    document.getElementById("addBookForMemberBtn").addEventListener("click", async () => {
      const memberId = document.getElementById("selectMember").value;
      const periodId = document.getElementById("selectPeriod").value;
      const title = document.getElementById("bookTitle").value.trim();
      const author = document.getElementById("bookAuthor").value.trim();
      const isbn = document.getElementById("bookISBN").value.trim();

      if (!memberId || !periodId || !title || !author) {
        return alert("Member, period, title, and author are required.");
      }

      let finalTitle = title;
      let finalAuthor = author;
      let coverUrl = "";
      let description = "";

      if (isbn) {
        try {
          const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
          const data = await res.json();
          const key = `ISBN:${isbn}`;
          if (data[key]) {
            finalTitle = data[key].title || finalTitle;
            finalAuthor = data[key].authors?.[0]?.name || finalAuthor;
            coverUrl = data[key].cover?.medium || "";
            description = "";
          }
        } catch (err) { console.error(err); }
      }

      await addDoc(collection(db, "books"), {
        title: finalTitle,
        author: finalAuthor,
        coverUrl,
        description,
        submittedBy: memberId,
        periodId,
        votes: 0,
        active: false,
        createdAt: serverTimestamp()
      });

      document.getElementById("addBookMessage").innerText = `Book "${finalTitle}" added for member successfully!`;
      document.getElementById("bookTitle").value = "";
      document.getElementById("bookAuthor").value = "";
      document.getElementById("bookISBN").value = "";
      renderPeriodsList();
    });

  </script>
</body>
</html>
