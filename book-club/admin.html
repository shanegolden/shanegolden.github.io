<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Book Club</title>
  <style>
    .book-card {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }
    .book-card img {
      width: 50px;
      height: 75px;
      object-fit: cover;
      margin-right: 10px;
    }
    .books-container {
      margin-left: 20px;
      margin-bottom: 15px;
    }
    .submission-period {
      margin-bottom: 15px;
      padding: 5px;
      border: 1px solid #ccc;
    }
    button { margin: 2px; }
  </style>
</head>
<body>
  <h1>📚 Admin Panel!</h1>

  <!-- Pending Members Section -->
  <div id="pendingMembers"></div>
  <hr>

  <!-- Submission Period Controls -->
  <button id="startSubmissions">Start Book Submissions</button>
  <button id="closeSubmissions">Close Book Submissions</button>
  <hr>

  <!-- Voting Controls -->
  <button id="startVoting">Start Voting</button>
  <button id="closeVoting">Close Voting</button>
  <hr>

  <!-- Add Book for Member Section -->
  <h2>Add Book for Member</h2>
  <select id="memberSelect"><option>Loading members...</option></select>
  <input id="bookTitle" placeholder="Book Title" />
  <input id="bookAuthor" placeholder="Author Name" />
  <input id="bookISBN" placeholder="ISBN (optional)" />
  <select id="submissionPeriodSelect"><option>Loading periods...</option></select>
  <button id="addBookForMemberBtn">Add Book</button>
  <div id="bookMessage"></div>
  <hr>

  <h2>Submission Periods</h2>
  <div id="submissionPeriodsContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, where 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Protect page: admin only
let currentUser;
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUser = user;
  const memberSnap = await getDocs(collection(db, "members"));
  const admin = memberSnap.docs.find(d => d.id === user.uid && d.data().role === "admin");
  if (!admin) {
    alert("Admin access only."); signOut(auth); window.location.href = "login.html";
  } else {
    loadPendingMembers();
    loadMembersSelect();
    loadSubmissionPeriods();
  }
});

// Pending Members
async function loadPendingMembers() {
  const membersSnap = await getDocs(collection(db, "members"));
  const pendingMembers = membersSnap.docs.filter(doc => !doc.data().approved && doc.data().role !== "admin");
  const container = document.getElementById("pendingMembers");
  container.innerHTML = "<h2>Pending Members</h2>";
  if (pendingMembers.length === 0) { container.innerHTML += "<p>No pending members.</p>"; return; }

  pendingMembers.forEach(docSnap => {
    const data = docSnap.data();
    const div = document.createElement("div");
    div.innerHTML = `${data.name || "(No name)"} (${data.email}) <button class="approveBtn">Approve</button> <button class="denyBtn">Deny</button><hr>`;
    container.appendChild(div);
    div.querySelector(".approveBtn").addEventListener("click", async () => { await updateDoc(doc(db, "members", docSnap.id), { approved: true }); div.remove(); });
    div.querySelector(".denyBtn").addEventListener("click", async () => { await deleteDoc(doc(db, "members", docSnap.id)); div.remove(); });
  });
}

// Load members dropdown for add book
async function loadMembersSelect() {
  const membersSnap = await getDocs(collection(db, "members"));
  const select = document.getElementById("memberSelect");
  select.innerHTML = "";
  membersSnap.docs.filter(d => d.data().approved && d.data().role !== "admin").forEach(docSnap => {
    const opt = document.createElement("option");
    opt.value = docSnap.id;
    opt.text = d.data().name || docSnap.data().email;
    select.appendChild(opt);
  });
}

// Load submission periods dropdown for add book
async function loadSubmissionPeriods() {
  const periodsSnap = await getDocs(collection(db, "submissionsPeriods"));
  const select = document.getElementById("submissionPeriodSelect");
  select.innerHTML = "";
  const container = document.getElementById("submissionPeriodsContainer");
  container.innerHTML = "";
  periodsSnap.docs.forEach(docSnap => {
    const data = docSnap.data();
    // Dropdown
    const opt = document.createElement("option");
    opt.value = docSnap.id;
    opt.text = new Date(data.startTime?.toMillis()).toLocaleString() || "Unnamed Period";
    select.appendChild(opt);

    // Display in container with "View Books" button
    const div = document.createElement("div");
    div.classList.add("submission-period");
    div.innerHTML = `<b>${opt.text}</b> <button class="viewBooksBtn">View Books</button><div class="books-container" style="display:none;"></div>`;
    container.appendChild(div);

    div.querySelector(".viewBooksBtn").addEventListener("click", async () => {
      const booksContainer = div.querySelector(".books-container");
      if (booksContainer.style.display === "none") {
        // Fetch books for this period
        const q = query(collection(db, "books"), where("periodId", "==", docSnap.id));
        const booksSnap = await getDocs(q);
        booksContainer.innerHTML = "";
        booksSnap.docs.forEach(bookDoc => {
          const book = bookDoc.data();
          const bookDiv = document.createElement("div");
          bookDiv.classList.add("book-card");
          bookDiv.innerHTML = `
            <img src="${book.coverUrl || ''}" alt="cover"/>
            <div>
              <b>${book.title}</b> by ${book.author} (submitted by ${book.submittedByName || book.submittedBy})
              <br>
              <button class="editBookBtn">Edit</button>
              <button class="deleteBookBtn">Delete</button>
            </div>
          `;
          booksContainer.appendChild(bookDiv);

          bookDiv.querySelector(".deleteBookBtn").addEventListener("click", async () => {
            await deleteDoc(doc(db, "books", bookDoc.id));
            bookDiv.remove();
          });

          bookDiv.querySelector(".editBookBtn").addEventListener("click", () => {
            alert("Edit book feature coming soon.");
          });
        });
        booksContainer.style.display = "block";
      } else {
        booksContainer.style.display = "none";
      }
    });
  });
}

// Start/Close submissions
document.getElementById("startSubmissions").addEventListener("click", async () => {
  await addDoc(collection(db, "submissionsPeriods"), { startTime: serverTimestamp(), open: true });
  alert("Book submissions started!");
  loadSubmissionPeriods();
});
document.getElementById("closeSubmissions").addEventListener("click", async () => {
  const periodsSnap = await getDocs(collection(db, "submissionsPeriods"));
  const lastPeriod = periodsSnap.docs[periodsSnap.docs.length - 1];
  if (lastPeriod) await updateDoc(doc(db, "submissionsPeriods", lastPeriod.id), { open: false, endTime: serverTimestamp() });
  alert("Book submissions closed!");
  loadSubmissionPeriods();
});

// Add Book for Member
document.getElementById("addBookForMemberBtn").addEventListener("click", async () => {
  const memberId = document.getElementById("memberSelect").value;
  const title = document.getElementById("bookTitle").value.trim();
  const author = document.getElementById("bookAuthor").value.trim();
  const isbn = document.getElementById("bookISBN").value.trim();
  const periodId = document.getElementById("submissionPeriodSelect").value;

  if (!title || !author) { alert("Title and author required"); return; }

  await addDoc(collection(db, "books"), {
    title, author, submittedBy: memberId, submittedByName: "", periodId, coverUrl: "", votes: 0, active: false, createdAt: serverTimestamp()
  });
  alert(`Book "${title}" added for member.`);
});
</script>
</body>
</html>
