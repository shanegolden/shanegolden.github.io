<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Book Club</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:0; }
  header { background:#4A90E2; color:white; padding:20px; text-align:center; }
  main { max-width: 1000px; margin:20px auto; background:white; padding:20px; border-radius:10px; }
  h1,h2,h3 { margin-top:0; }
  button { padding:8px 15px; margin:5px; border:none; border-radius:5px; cursor:pointer; }
  button.primary { background:#4A90E2; color:white; }
  button.secondary { background:#7ED321; color:white; }
  button.danger { background:#d9534f; color:white; }
  button.disabled { background:grey; cursor:default; }
  .member, .book-card { background:#f9f9f9; padding:10px; margin:10px 0; border-radius:8px; }
  .book-card { display:flex; align-items:center; }
  .book-card img { width:100px; margin-right:15px; border-radius:5px; }
  .book-card .info { flex:1; }
  .alternatives { margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; }
  .alternatives div { cursor:pointer; padding:5px; border:1px solid #ccc; border-radius:5px; display:flex; align-items:center; }
  .alternatives img { width:80px; margin-right:10px; border-radius:5px; }
  #logoutBtn { position:fixed; top:20px; right:20px; padding:10px 20px; background:#d9534f; color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>📚 Admin Panel</h1>
  <button id="logoutBtn">Logout</button>
</header>

<main>
  <h2>Book Submission Control</h2>
  <button id="startSubmissions" class="primary">Start Book Submissions</button>
  <button id="closeSubmissions" class="danger">Close Book Submissions</button>

  <h2>Members</h2>
  <div id="membersContainer"></div>

  <h2>Add Book for Member</h2>
  <div>
    <select id="memberSelect"></select><br>
    <input type="text" id="bookTitle" placeholder="Book Title">
    <input type="text" id="bookAuthor" placeholder="Author Name">
    <input type="text" id="bookISBN" placeholder="ISBN (optional)">
    <select id="submissionPeriodSelect"></select><br>
    <button id="addBookBtn" class="secondary">Add Book</button>
    <div id="bookMessage"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, doc, getDocs, addDoc, updateDoc, onSnapshot, query, where, orderBy, serverTimestamp, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "sog7PT2TXTTqqXQFvG2j63blC6f1"; // Update your admin UID here

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href="login.html";
});

let currentUser=null;

// Check admin access
onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;
  if(user.uid!==ADMIN_UID){ alert("Admin only"); window.location.href="login.html"; }
  loadMembers();
  loadSubmissionPeriods();
});

// ---------------- Members ----------------
async function loadMembers(){
  const snap = await getDocs(collection(db,"members"));
  const container=document.getElementById("membersContainer");
  container.innerHTML="";
  const selectMember=document.getElementById("memberSelect");
  selectMember.innerHTML="<option value=''>Select Member</option>";
  snap.forEach(docSnap=>{
    const data=docSnap.data();
    if(data.role!=="admin"){
      const div=document.createElement("div");
      div.className="member";
      div.innerHTML=`<strong>${data.name||"(No Name)"}</strong> (${data.email})<div id="memberBooks-${docSnap.id}"></div>`;
      container.appendChild(div);
      selectMember.innerHTML+=`<option value="${docSnap.id}">${data.name}</option>`;
      loadMemberBooks(docSnap.id);
    }
  });
}

// ---------------- Submission Periods ----------------
async function loadSubmissionPeriods(){
  const snap = collection(db,"submissionsPeriods");
  onSnapshot(snap, snapshot=>{
    const selectPeriod=document.getElementById("submissionPeriodSelect");
    selectPeriod.innerHTML="";
    snapshot.forEach(docSnap=>{
      const data=docSnap.data();
      const option=document.createElement("option");
      option.value=docSnap.id;
      const date = data.startTime ? new Date(data.startTime.seconds*1000).toLocaleString() : docSnap.id;
      option.innerText=date;
      selectPeriod.appendChild(option);
    });
  });
}

// ---------------- Start/Close Submissions ----------------
document.getElementById("startSubmissions").addEventListener("click", async ()=>{
  const snap = await getDocs(collection(db,"submissionsPeriods"));
  await addDoc(collection(db,"submissionsPeriods"),{active:true,startTime:serverTimestamp()});
  snap.forEach(docSnap=>updateDoc(doc(db,"submissionsPeriods",docSnap.id),{active:false}));
});

document.getElementById("closeSubmissions").addEventListener("click", async ()=>{
  const snap = await getDocs(collection(db,"submissionsPeriods"));
  snap.forEach(docSnap=>updateDoc(doc(db,"submissionsPeriods",docSnap.id),{active:false}));
});

// ---------------- Add Book for Member ----------------
async function fetchMatchedBook(title,author,isbn){
  let alternatives=[];
  if(isbn){
    try{
      const res=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
      const data=await res.json();
      const key=`ISBN:${isbn}`;
      if(data[key]) alternatives.push({title:data[key].title||title,author:data[key].authors?.[0]?.name||author,coverUrl:data[key].cover?.medium||""});
    }catch(e){console.error(e);}
  }
  try{
    const res=await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=10`);
    const data=await res.json();
    if(data.docs.length>0){
      data.docs.forEach(doc=>{
        alternatives.push({title:doc.title,author:doc.author_name?.[0]||"",coverUrl:doc.cover_i?`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`:""});
      });
    }
  }catch(e){console.error(e);}
  return { title: alternatives[0]?.title||title, author: alternatives[0]?.author||author, coverUrl: alternatives[0]?.coverUrl||"", alternatives };
}

document.getElementById("addBookBtn").addEventListener("click", async ()=>{
  const memberId=document.getElementById("memberSelect").value;
  const periodId=document.getElementById("submissionPeriodSelect").value;
  const title=document.getElementById("bookTitle").value.trim();
  const author=document.getElementById("bookAuthor").value.trim();
  const isbn=document.getElementById("bookISBN").value.trim();
  if(!memberId||!periodId||!title||!author){ document.getElementById("bookMessage").innerText="Fill all fields"; return; }

  const matched=await fetchMatchedBook(title,author,isbn);
  try{
    await addDoc(collection(db,"books"),{
      title:matched.title,
      author:matched.author,
      coverUrl:matched.coverUrl,
      submittedBy:memberId,
      submissionPeriodId:periodId,
      createdAt:serverTimestamp(),
      alternatives:matched.alternatives
    });
    document.getElementById("bookMessage").innerText="Book added successfully!";
    loadMemberBooks(memberId);
  }catch(e){console.error(e);}
});

// ---------------- Member Books ----------------
async function loadMemberBooks(memberId){
  const container=document.getElementById(`memberBooks-${memberId}`);
  container.innerHTML="";
  const q=query(collection(db,"books"),where("submittedBy","==",memberId),orderBy("createdAt","desc"));
  const snap=await getDocs(q);
  snap.forEach(docSnap=>{
    const data=docSnap.data();
    const card=document.createElement("div");
    card.className="book-card";
    card.innerHTML=`<img src="${data.coverUrl||''}"><div class="info"><strong>${data.title}</strong><br>by ${data.author}</div>
    <div class="actions">
      <button class="edit">Edit</button>
      <button class="delete">Delete</button>
    </div>`;
    container.appendChild(card);

    // Edit inline
    const editBtn=card.querySelector(".edit");
    editBtn.addEventListener("click", ()=>{
      showEditOptions(card,docSnap.id,data);
    });

    // Delete book
    const deleteBtn=card.querySelector(".delete");
    deleteBtn.addEventListener("click", async ()=>{
      await deleteDoc(doc(db,"books",docSnap.id));
      loadMemberBooks(memberId);
    });
  });
}

// Inline edit with alternatives
function showEditOptions(card,bookId,data){
  card.innerHTML=`<img src="${data.coverUrl||''}"><div class="info"><strong>${data.title}</strong><br>by ${data.author}</div>`;
  const altDiv=document.createElement("div"); altDiv.className="alternatives"; card.appendChild(altDiv);
  data.alternatives.forEach(alt=>{
    const option=document.createElement("div");
    option.innerHTML=`<img src="${alt.coverUrl||''}"><span>${alt.title} by ${alt.author}</span>`;
    option.addEventListener("click", async ()=>{
      await updateDoc(doc(db,"books",bookId),{title:alt.title,author:alt.author,coverUrl:alt.coverUrl});
      loadMemberBooks(data.submittedBy);
    });
    altDiv.appendChild(option);
  });
}
</script>
</body>
</html>
