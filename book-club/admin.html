<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Book Club</title>
<style>
body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:0; }
header { background:#4A90E2; color:white; padding:20px; display:flex; justify-content:space-between; align-items:center; }
header button { padding:10px 20px; background:#d9534f; color:white; border:none; border-radius:5px; cursor:pointer; }
main { max-width:1200px; margin:20px auto; background:white; padding:20px; border-radius:10px; }
h1,h2,h3 { margin-top:0; }
button { padding:8px 15px; margin:5px; border:none; border-radius:5px; cursor:pointer; }
button.primary { background:#4A90E2; color:white; }
button.secondary { background:#7ED321; color:white; }
button.delete { background:#d9534f; color:white; }
input, select { padding:8px; margin:5px 0; width:100%; max-width:400px; }
.period-card { background:#f9f9f9; padding:10px; margin:10px 0; border-radius:8px; }
.submission-card { display:flex; align-items:center; background:#eef; padding:10px; margin:10px 0; border-radius:8px; flex-wrap:wrap; }
.submission-card img { width:120px; margin-right:15px; border-radius:5px; }
.submission-card .info { flex:1; min-width:200px; }
.alternatives { margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; }
.alternatives div { cursor:pointer; padding:5px; border:1px solid #ccc; border-radius:5px; display:flex; align-items:center; background:white; }
.alternatives img { width:80px; margin-right:10px; border-radius:5px; }
</style>
</head>
<body>

<header>
<h1>📚 Admin Panel</h1>
<button id="logoutBtn">Logout</button>
</header>

<main>
<h2>Create / Toggle Book Submissions</h2>
<input id="newPeriodName" placeholder="Submission Period Name (required)">
<button id="toggleSubmissionsBtn" class="primary"></button>

<h2>Submission Periods</h2>
<div id="periodsContainer"></div>

<h2>Add Book for Member</h2>
<select id="memberSelect"></select>
<input id="bookTitle" placeholder="Book Title">
<input id="bookAuthor" placeholder="Author Name">
<input id="bookISBN" placeholder="ISBN (optional)">
<select id="submissionPeriodSelect"></select>
<button id="addBookBtn" class="secondary">Add Book</button>
<div id="bookMessage"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { 
  getFirestore, collection, getDocs, doc, updateDoc, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
  authDomain: "book-club-f42b1.firebaseapp.com",
  projectId: "book-club-f42b1",
  storageBucket: "book-club-f42b1.appspot.com",
  messagingSenderId: "85630091573",
  appId: "1:85630091573:web:427077f1351140fc278c7c",
  measurementId: "G-8BD4H79Z5Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
let activePeriod=null;
let members=[];

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href="login.html";
});

// Protect Admin Page
onAuthStateChanged(auth, async user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;
  const membersSnap = await getDocs(collection(db,"members"));
  members = membersSnap.docs.map(d=>({id:d.id,...d.data()}));
  const admin = members.find(m=>m.id===user.uid && m.role==="admin");
  if(!admin){ alert("Admin only"); auth.signOut(); window.location.href="login.html"; return; }

  listenSubmissionPeriods();
  loadMemberSelect();
});

// Real-time Submission Periods & Toggle Button
function listenSubmissionPeriods(){
  onSnapshot(collection(db,"submissionsPeriods"), snapshot=>{
    activePeriod=null;
    snapshot.forEach(docSnap=>{ if(docSnap.data().active) activePeriod={id:docSnap.id,...docSnap.data()}; });
    updateToggleButton();
    loadPeriods(snapshot.docs);
  });
}

function updateToggleButton(){
  const btn=document.getElementById("toggleSubmissionsBtn");
  if(activePeriod) btn.innerText="Close Book Submissions"; else btn.innerText="Start Book Submissions";
}

document.getElementById("toggleSubmissionsBtn").addEventListener("click", async ()=>{
  if(activePeriod){
    await updateDoc(doc(db,"submissionsPeriods",activePeriod.id),{active:false});
  }else{
    const name=document.getElementById("newPeriodName").value.trim();
    if(!name){ alert("Enter a name for the submission period"); return; }
    await addDoc(collection(db,"submissionsPeriods"),{active:true,name:name, createdAt:serverTimestamp()});
    document.getElementById("newPeriodName").value="";
  }
});

// Load Submission Periods
async function loadPeriods(periodDocs){
  const container=document.getElementById("periodsContainer");
  container.innerHTML="";
  periodDocs.sort((a,b)=>b.data().createdAt?.seconds-(a.data().createdAt?.seconds||0));
  periodDocs.forEach(period=>{
    const data=period.data();
    const card=document.createElement("div");
    card.className="period-card";
    const timestamp=data.createdAt?.toDate().toLocaleString()||new Date().toLocaleString();
    card.innerHTML=`<h3>${data.name} (${timestamp})</h3>`;
    const btn=document.createElement("button"); btn.innerText="See Submissions"; btn.className="secondary";
    btn.addEventListener("click",()=>loadBooksForPeriod(period.id,card));
    card.appendChild(btn);
    container.appendChild(card);
  });
}

// Load Books per Period
async function loadBooksForPeriod(periodId,card){
  let existing = card.querySelector(".booksContainer");
  if(existing){ existing.remove(); return; }
  const booksContainer = document.createElement("div"); booksContainer.className="booksContainer";
  const q=query(collection(db,"books"),where("submissionPeriodId","==",periodId),orderBy("createdAt","desc"));
  const snap=await getDocs(q);
  snap.forEach(docSnap=>{
    const book=docSnap.data();
    const member=members.find(m=>m.id===book.submittedBy);
    const bcard=document.createElement("div"); bcard.className="submission-card";
    bcard.innerHTML=`<img src="${book.coverUrl||''}"><div class="info"><strong>${book.title}</strong><br>by ${book.author}<br>Submitted by: ${member?.name||member?.email||book.submittedBy}</div>`;
    
    // Edit Button
    const editBtn=document.createElement("button"); editBtn.innerText="Edit"; editBtn.className="secondary";
    editBtn.addEventListener("click",()=>showEditOptions(bcard,docSnap.id,book));
    bcard.appendChild(editBtn);
    
    // Delete Button
    const delBtn=document.createElement("button"); delBtn.innerText="Delete"; delBtn.className="delete";
    delBtn.addEventListener("click", async ()=>{
      await deleteDoc(doc(db,"books",docSnap.id));
      loadBooksForPeriod(periodId,card);
    });
    bcard.appendChild(delBtn);
    
    booksContainer.appendChild(bcard);
  });
  card.appendChild(booksContainer);
}

// Edit Book Inline
function showEditOptions(card,bookId,data){
  card.innerHTML=`<img src="${data.coverUrl||''}"><div class="info"><strong>${data.title}</strong><br>by ${data.author}</div>`;
  const altDiv=document.createElement("div"); altDiv.className="alternatives"; card.appendChild(altDiv);
  const alternatives=[data]; // placeholder for real API matches
  alternatives.forEach(alt=>{
    const option=document.createElement("div");
    option.innerHTML=`<img src="${alt.coverUrl||''}"><span>${alt.title} by ${alt.author}</span>`;
    option.addEventListener("click", async ()=>{
      await updateDoc(doc(db,"books",bookId),{title:alt.title,author:alt.author,coverUrl:alt.coverUrl});
      card.innerHTML=`<img src="${alt.coverUrl||''}"><div class="info"><strong>${alt.title}</strong><br>by ${alt.author}</div>`;
    });
    altDiv.appendChild(option);
  });
}

// Add Book for Member
function loadMemberSelect(){
  const sel=document.getElementById("memberSelect");
  const perSel=document.getElementById("submissionPeriodSelect");
  sel.innerHTML=""; perSel.innerHTML="";
  members.forEach(m=>{ const o=document.createElement("option"); o.value=m.id; o.innerText=m.name||m.email; sel.appendChild(o); });
  onSnapshot(collection(db,"submissionsPeriods"),snap=>{
    perSel.innerHTML="";
    snap.docs.sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0)).forEach(d=>{
      const opt=document.createElement("option");
      const ts=d.data().name || (d.data().createdAt?.toDate().toLocaleString()||new Date().toLocaleString());
      opt.value=d.id; opt.innerText=ts; perSel.appendChild(opt);
    });
  });
}

document.getElementById("addBookBtn").addEventListener("click", async ()=>{
  const memberId=document.getElementById("memberSelect").value;
  const periodId=document.getElementById("submissionPeriodSelect").value;
  const title=document.getElementById("bookTitle").value.trim();
  const author=document.getElementById("bookAuthor").value.trim();
  const isbn=document.getElementById("bookISBN").value.trim();
  if(!title||!author){ document.getElementById("bookMessage").innerText="Title and author required."; return; }
  await addDoc(collection(db,"books"),{title,author,isbn,submittedBy:memberId,submissionPeriodId:periodId,coverUrl:"",votes:0,createdAt:serverTimestamp()});
  document.getElementById("bookMessage").innerText="Book added successfully!";
  document.getElementById("bookTitle").value=""; document.getElementById("bookAuthor").value=""; document.getElementById("bookISBN").value="";
});
</script>
</body>
</html>
