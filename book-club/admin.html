<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Book Club</title>
</head>
<body>
  <h1>📚 Admin Panel</h1>

  <!-- Submission Period Control -->
  <button id="openSubmissions">Open Book Submissions</button>
  <button id="closeSubmissions">Close Book Submissions</button>
  <p id="submissionStatus"></p>
  <hr>

  <!-- Pending Members Section -->
  <div id="pendingMembers"></div>
  <hr>

  <!-- Add Book for Member -->
  <h2>Add Book for Member</h2>
  <select id="memberSelect"></select>
  <input id="bookTitle" placeholder="Book Title">
  <input id="bookAuthor" placeholder="Author Name">
  <input id="bookISBN" placeholder="ISBN (optional)">
  <button id="addBookBtn">Add Book</button>
  <div id="bookMessage"></div>
  <hr>

  <!-- Member Submissions -->
  <div id="memberBooksContainer"></div>

  <button id="logoutBtn">Log Out</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
      authDomain: "book-club-f42b1.firebaseapp.com",
      projectId: "book-club-f42b1",
      storageBucket: "book-club-f42b1.appspot.com",
      messagingSenderId: "85630091573",
      appId: "1:85630091573:web:427077f1351140fc278c7c",
      measurementId: "G-8BD4H79Z5Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentPeriodDoc = null;
    const submissionStatusP = document.getElementById("submissionStatus");

    // Protect page: admin only
    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      const membersSnap = await getDocs(collection(db, "members"));
      const admin = membersSnap.docs.find(d => d.id === user.uid && d.data().role === "admin");
      if (!admin) {
        alert("Admin access only.");
        auth.signOut();
        return window.location.href = "login.html";
      }
      await loadSubmissionPeriod();
      loadPendingMembers();
      loadMemberSelect();
      loadAllMemberBooks();
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Submission period functions
    async function loadSubmissionPeriod() {
      const periodsSnap = await getDocs(collection(db, "submissionPeriods"));
      currentPeriodDoc = periodsSnap.docs.find(d => d.data().open) || null;
      submissionStatusP.innerText = currentPeriodDoc ? "Submissions are OPEN" : "Submissions are CLOSED";
    }

    document.getElementById("openSubmissions").addEventListener("click", async () => {
      if (currentPeriodDoc) {
        await updateDoc(doc(db, "submissionPeriods", currentPeriodDoc.id), { open: false });
      }
      const newPeriodRef = await addDoc(collection(db, "submissionPeriods"), {
        open: true,
        createdAt: serverTimestamp()
      });
      currentPeriodDoc = { id: newPeriodRef.id, data: { open: true } };
      submissionStatusP.innerText = "Submissions are OPEN";
    });

    document.getElementById("closeSubmissions").addEventListener("click", async () => {
      if (!currentPeriodDoc) return;
      await updateDoc(doc(db, "submissionPeriods", currentPeriodDoc.id), { open: false });
      currentPeriodDoc = null;
      submissionStatusP.innerText = "Submissions are CLOSED";
    });

    // Pending members
    async function loadPendingMembers() {
      const membersSnap = await getDocs(collection(db, "members"));
      const pendingMembers = membersSnap.docs.filter(d => !d.data().approved && d.data().role !== "admin");
      const container = document.getElementById("pendingMembers");
      container.innerHTML = "<h2>Pending Members</h2>";
      if (!pendingMembers.length) return container.innerHTML += "<p>No pending members.</p>";

      pendingMembers.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.innerHTML = `
          ${data.name || "(No name)"} (${data.email})
          <button class="approveBtn">Approve</button>
          <button class="denyBtn">Deny</button><hr>
        `;
        container.appendChild(div);

        div.querySelector(".approveBtn").addEventListener("click", async () => {
          await updateDoc(doc(db, "members", docSnap.id), { approved: true });
          div.remove();
          loadMemberSelect();
        });
        div.querySelector(".denyBtn").addEventListener("click", async () => {
          await deleteDoc(doc(db, "members", docSnap.id));
          div.remove();
        });
      });
    }

    // Load members for select dropdown
    async function loadMemberSelect() {
      const membersSnap = await getDocs(collection(db, "members"));
      const select = document.getElementById("memberSelect");
      select.innerHTML = "";
      membersSnap.docs.filter(d => d.data().approved).forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.innerText = d.data().name || d.data().email;
        select.appendChild(opt);
      });
    }

    // Add book for member
    async function fetchBookInfo(isbn) {
      if (!isbn) return null;
      try {
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const data = await res.json();
        const key = `ISBN:${isbn}`;
        if (data[key]) return {
          title: data[key].title || "",
          author: data[key].authors?.[0]?.name || "",
          coverUrl: data[key].cover?.medium || ""
        };
      } catch (err) { console.error(err); }
      return null;
    }

    document.getElementById("addBookBtn").addEventListener("click", async () => {
      const memberId = document.getElementById("memberSelect").value;
      const titleInput = document.getElementById("bookTitle").value.trim();
      const authorInput = document.getElementById("bookAuthor").value.trim();
      const isbnInput = document.getElementById("bookISBN").value.trim();

      if (!titleInput || !authorInput) return alert("Title and author required.");

      let title = titleInput;
      let author = authorInput;
      let coverUrl = "";

      if (isbnInput) {
        const info = await fetchBookInfo(isbnInput);
        if (info) {
          title = info.title || title;
          author = info.author || author;
          coverUrl = info.coverUrl || "";
        }
      }

      await addDoc(collection(db, "books"), {
        title,
        author,
        coverUrl,
        submittedBy: memberId,
        periodId: currentPeriodDoc?.id || null,
        votes: 0,
        active: false,
        createdAt: serverTimestamp()
      });

      document.getElementById("bookMessage").innerText = `Book "${title}" added for member successfully!`;
      document.getElementById("bookTitle").value = "";
      document.getElementById("bookAuthor").value = "";
      document.getElementById("bookISBN").value = "";
      loadAllMemberBooks();
    });

    // Load all member books
    async function loadAllMemberBooks() {
      const booksSnap = await getDocs(collection(db, "books"));
      const container = document.getElementById("memberBooksContainer");
      container.innerHTML = "<h2>Member Submissions</h2>";
      if (!booksSnap.docs.length) return container.innerHTML += "<p>No submissions yet.</p>";

      booksSnap.docs.forEach(b => {
        const data = b.data();
        const div = document.createElement("div");
        div.innerHTML = `
          <strong>${data.title}</strong> by ${data.author} (Submitted by ${data.submittedBy})
          <button class="deleteBtn">Delete</button>
          <hr>
        `;
        container.appendChild(div);

        div.querySelector(".deleteBtn").addEventListener("click", async () => {
          await deleteDoc(doc(db, "books", b.id));
          div.remove();
        });
      });
    }

  </script>
</body>
</html>
