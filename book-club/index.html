<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Club</title>
</head>
<body>
  <h1>📚 Welcome to the Book Club</h1>
  <div id="app"></div>

<script type="module">
  // Firebase SDKs
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // 🔑 Your Firebase config (leave as you have it)
  const firebaseConfig = {
    apiKey: "AIzaSyARFfiXUa27jTt2nfuStSGZL4HCCp5oPx0",
    authDomain: "book-club-f42b1.firebaseapp.com",
    projectId: "book-club-f42b1",
    storageBucket: "book-club-f42b1.appspot.com",
    messagingSenderId: "85630091573",
    appId: "1:85630091573:web:427077f1351140fc278c7c",
    measurementId: "G-8BD4H79Z5Q"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Render signup form (now includes name)
  document.getElementById("app").innerHTML = `
    <h2>Sign Up</h2>
    <input id="name" placeholder="Full name" />
    <input id="email" placeholder="Email" />
    <input id="password" placeholder="Password" type="password" />
    <button id="signup">Sign Up</button>
    <p id="message"></p>
  `;

  // Signup logic: create Auth user, then create members doc with UID
  document.getElementById("signup").addEventListener("click", async () => {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
      document.getElementById("message").innerText = "Please fill name, email, and password.";
      return;
    }

    try {
      // 1) create account in Firebase Auth
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      // 2) create a members document with the UID as the doc id
      await setDoc(doc(db, "members", uid), {
        name: name,
        email: email,
        approved: false,
        role: "member",      // default role
        appliedAt: new Date()
      });

      document.getElementById("message").innerText = "Signup success! Waiting for admin approval.";
    } catch (error) {
      console.error("Signup error:", error);
      document.getElementById("message").innerText = error.message;
    }
  });
</script>

</body>
</html>
